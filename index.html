    <script>
      // Non-blocking dynamic pricing updater
      window.addEventListener('DOMContentLoaded', function(){
        fetch('/api/public/checkout-settings')
          .then(function(r){ return r.json(); })
          .then(function(d){
            if(!d || !d.price || d.price === 99000) return;
            var formatted = 'Rp ' + d.price.toLocaleString('id-ID');
            window.__SM_PRICE = formatted;
            window.__SM_PRICE_RAW = d.price;
            
            function replaceNodes(){
              var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
              var node;
              while(node = walker.nextNode()){
                if(node.nodeValue && node.nodeValue.indexOf('99.000') !== -1){
                  node.nodeValue = node.nodeValue.replace(/Rp\s*99\.000/g, formatted).replace(/99\.000/g, d.price.toLocaleString('id-ID'));
                }
              }
            }
            setTimeout(replaceNodes, 400);
            setTimeout(replaceNodes, 1200);
          })
          .catch(function(){});
      });
    </script>
