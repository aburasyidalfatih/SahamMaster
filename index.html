    <script>
      // Dynamic price: fetch from API then replace all hardcoded prices in the DOM
      (function(){
        fetch('/api/public/checkout-settings').then(function(r){return r.json()}).then(function(d){
          if(!d.price || d.price===99000) return; // skip if default
          var formatted = 'Rp ' + d.price.toLocaleString('id-ID');
          window.__SM_PRICE = formatted;
          window.__SM_PRICE_RAW = d.price;
          
          function replacePrice(){
            // Walk all text nodes and replace "Rp 99.000" with dynamic price
            var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
            var node;
            while(node = walker.nextNode()){
              if(node.nodeValue && node.nodeValue.indexOf('99.000') !== -1){
                node.nodeValue = node.nodeValue.replace(/Rp\s*99\.000/g, formatted).replace(/99\.000/g, d.price.toLocaleString('id-ID'));
              }
              if(node.nodeValue && node.nodeValue.indexOf('Ambil Promo Rp') !== -1){
                node.nodeValue = node.nodeValue.replace(/Ambil Promo Rp\s*99\.000/, 'Ambil Promo ' + formatted);
              }
            }
          }
          
          // Run immediately and also observe for lazy-loaded content
          setTimeout(replacePrice, 500);
          setTimeout(replacePrice, 1500);
          setTimeout(replacePrice, 3000);
          
          var observer = new MutationObserver(function(){ replacePrice(); });
          observer.observe(document.body, {childList:true, subtree:true});
          // Stop observing after 30s to save resources
          setTimeout(function(){ observer.disconnect(); }, 30000);
        }).catch(function(){});
      })();
    </script>
